<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chúc mừng ngày Nhà giáo Việt Nam 20/11</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Charm:wght@700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --board: #1f3d36;
  --board-edge: #5b3a24;
  --chalk: #f3f1e8;
  --chalk-dim: #b9c7bf;
  --yellow: #f2cf5b;
  --pink: #f29ab0;
  --box: #d94f6b;
  --box-dark: #b23a55;
  --ribbon: #f2cf5b;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: #14231f;
  color: var(--chalk);
  font-family: "Patrick Hand", "Comic Sans MS", cursive, sans-serif;
  display: grid;
  place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
  overflow-x: hidden;
}
.stage { display: grid; width: min(880px, 100%); place-items: center; }
.stage > * { grid-area: 1 / 1; }

/* ---------- Gift ---------- */
.gift {
  background: none; border: 0; padding: 0; cursor: pointer;
  color: inherit; font: inherit;
  display: flex; flex-direction: column; align-items: center; gap: 36px;
  transition: opacity .5s ease .9s, visibility 0s linear 1.4s;
}
.gift:focus-visible { outline: 3px solid var(--yellow); outline-offset: 12px; border-radius: 12px; }
.box { position: relative; width: 200px; height: 190px; animation: wobble 2.2s ease-in-out infinite; }
.base {
  position: absolute; bottom: 0; left: 8px; right: 8px; height: 125px;
  background: var(--box); border-radius: 0 0 8px 8px;
  box-shadow: inset -14px 0 0 rgba(0,0,0,.12);
}
.base::after, .lid::after {
  content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 30px;
  transform: translateX(-50%); background: var(--ribbon);
}
.lid {
  position: absolute; left: 0; right: 0; top: 22px; height: 52px;
  background: var(--box-dark); border-radius: 6px;
  transform-origin: 20% 100%;
  transition: transform .9s cubic-bezier(.3,1.4,.5,1), opacity .5s ease .5s;
}
.bow { position: absolute; left: 50%; top: -34px; width: 70px; height: 40px; transform: translateX(-50%); z-index: 2; }
.bow::before, .bow::after {
  content: ""; position: absolute; top: 4px; width: 32px; height: 32px;
  border: 7px solid var(--ribbon); border-radius: 50% 50% 50% 0;
}
.bow::before { left: 0; transform: rotate(-45deg); }
.bow::after { right: 0; transform: rotate(135deg); }
.hint { font-size: clamp(22px, 5vw, 30px); color: var(--chalk-dim); animation: pulse 2s ease-in-out infinite; }
@keyframes wobble { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg); } }
@keyframes pulse { 50% { opacity: .45; } }

.opened .gift { opacity: 0; visibility: hidden; pointer-events: none; }
.opened .lid { transform: translate(40px, -150px) rotate(24deg); opacity: 0; }
.opened .box { animation: none; }
.opened .hint { animation: none; opacity: 0; transition: opacity .2s; }

/* ---------- Confetti ---------- */
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.confetti i {
  position: absolute; left: 50%; top: 50%; width: 10px; height: 16px;
  background: var(--c); opacity: 0;
  animation: burst 1.8s cubic-bezier(.15,.7,.3,1) forwards;
}
@keyframes burst {
  0% { opacity: 1; transform: translate(0,0) rotate(0); }
  100% { opacity: 0; transform: translate(var(--x), var(--y)) rotate(var(--r)); }
}

/* ---------- Card ---------- */
.frame {
  width: 100%;
  padding: clamp(10px, 2vw, 18px);
  background: var(--board-edge);
  border-radius: 10px;
  box-shadow: 0 18px 40px rgba(0,0,0,.45);
  opacity: 0; visibility: hidden; transform: scale(.85) translateY(20px);
  transition: opacity .7s ease 1s, transform .8s cubic-bezier(.2,1.2,.4,1) 1s, visibility 0s linear 1s;
}
.opened .frame { opacity: 1; visibility: visible; transform: none; }
.board {
  background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.06), transparent 60%), var(--board);
  border-radius: 4px;
  padding: clamp(28px, 6vw, 64px) clamp(22px, 6vw, 72px);
  text-align: center;
  box-shadow: inset 0 0 40px rgba(0,0,0,.35);
}
.date { font-family: "Charm", "Brush Script MT", cursive; font-size: clamp(64px, 16vw, 132px); line-height: 1; margin: 0; color: var(--yellow); transform: rotate(-3deg); display: inline-block; }
.title { margin: 10px 0 0; font-size: clamp(20px, 4vw, 30px); color: var(--chalk-dim); }
.rule { width: min(320px, 70%); height: 6px; margin: 26px auto; color: var(--chalk-dim); }
.msg { margin: 0 auto; max-width: 34em; font-size: clamp(22px, 4.4vw, 34px); line-height: 1.5; }
.msg .who { display: block; margin-top: 14px; font-family: "Charm", cursive; font-size: 1.5em; color: var(--pink); }
.from { margin: 28px 0 0; font-size: clamp(18px, 3.4vw, 24px); color: var(--chalk-dim); }
.tray { height: 8px; margin-top: clamp(20px, 4vw, 36px); background: #3a2616; border-radius: 0 0 4px 4px; }

.reveal { clip-path: inset(0 100% 0 0); }
.opened .reveal { animation: write 2.6s steps(40, end) 1.8s forwards; }
@keyframes write { to { clip-path: inset(0 0 0 0); } }

@media (prefers-reduced-motion: reduce) {
  .box, .hint { animation: none; }
  .gift, .lid, .frame { transition-duration: .01s; transition-delay: 0s; }
  .reveal { clip-path: none; }
  .opened .reveal { animation: none; }
  .confetti { display: none; }
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <button class="gift" id="gift" type="button" aria-label="Khui quà">
    <span class="box" aria-hidden="true">
      <span class="base"></span>
      <span class="lid"><span class="bow"></span></span>
    </span>
    <span class="hint">Chạm để khui quà</span>
  </button>

  <main class="frame" aria-live="polite">
    <section class="board">
      <h1 class="date">20/11</h1>
      <p class="title">Ngày Nhà giáo Việt Nam</p>
      <svg class="rule" viewBox="0 0 320 6" preserveAspectRatio="none" aria-hidden="true">
        <path d="M2 3 Q 40 0 80 3 T 160 3 T 240 3 T 318 3" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
      </svg>
      <p class="msg reveal">
        Nhân dịp 20/11, lớp TIP001 K49 chúc cô
        <span class="who">Kim Thanh</span>
        luôn dồi dào sức khỏe, có thật nhiều niềm vui, hạnh phúc trên hành trình gieo tri thức ạaa
      </p>
      <p class="from">Lớp TIP001 K49</p>
      <div class="tray"></div>
    </section>
  </main>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var gift = document.getElementById('gift');
  var box = document.getElementById('confetti');
  var colors = ['#f2cf5b', '#f29ab0', '#f3f1e8', '#7fd1b9', '#d94f6b', '#8ab4ff'];
  var opened = false;

  function burst() {
    for (var i = 0; i < 70; i++) {
      var p = document.createElement('i');
      var a = Math.random() * Math.PI * 2;
      var d = 120 + Math.random() * Math.min(window.innerWidth, 700) * 0.55;
      p.style.setProperty('--c', colors[i % colors.length]);
      p.style.setProperty('--x', Math.cos(a) * d + 'px');
      p.style.setProperty('--y', (Math.sin(a) * d - 80 + Math.random() * 220) + 'px');
      p.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      p.style.animationDelay = (Math.random() * 0.25) + 's';
      box.appendChild(p);
    }
    setTimeout(function () { box.innerHTML = ''; }, 2600);
  }

  gift.addEventListener('click', function () {
    if (opened) return;
    opened = true;
    stage.classList.add('opened');
    gift.setAttribute('aria-hidden', 'true');
    gift.tabIndex = -1;
    burst();
  });
})();
</script>
</body>
</html>
